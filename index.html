<script>

const FO=[['sistema','Sistema','-apple-system,BlinkMacSystemFont,system-ui,sans-serif',''],['nunito','Nunito',"Nunito,-apple-system,sans-serif",'Nunito'],['poppins','Poppins',"Poppins,-apple-system,sans-serif",'Poppins'],['quicksand','Quicksand',"Quicksand,-apple-system,sans-serif",'Quicksand'],['lora','Lora',"Lora,Georgia,serif",'Lora'],['playfair','Playfair',"'Playfair Display',Georgia,serif",'Playfair+Display'],['mono','Space Mono',"'Space Mono',ui-monospace,monospace",'Space+Mono'],['montserrat','Montserrat',"Montserrat,-apple-system,sans-serif",'Montserrat'],['merri','Merriweather',"Merriweather,Georgia,serif",'Merriweather'],['fredoka','Fredoka',"Fredoka,-apple-system,sans-serif",'Fredoka']];
function loadFont(f){if(!f[3]||document.getElementById('f-'+f[0]))return;const l=document.createElement('link');l.id='f-'+f[0];l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f[3]+':wght@400;700&display=swap';document.head.appendChild(l)}

function cal(m,NI){const f=(new Date(m.y,m.c,1).getDay()+6)%7,n=dim(m.key),by={};entries.forEach(e=>{if(e.d.startsWith(m.key)){const d=+e.d.slice(8);by[d]=(by[d]||0)+e.h}});const mx=Math.max(4,...Object.values(by));let c=['L','M','M','G','V','S','D'].map(x=>`<b>${x}</b>`).join('');for(let i=0;i<f;i++)c+='<i></i>';for(let d=1;d<=n;d++){const h=by[d]||0,iso=`${m.key}-${pad(d)}`;c+=`<button class="dy${iso===todayIso?' td':''}${iso===sheet?' sl':''}${iso===NI?' new':''}" data-dy="${iso}"${h?` style="background:color-mix(in srgb,var(--acc) ${Math.round(18+47*h/mx)}%,transparent)"`:''}>${d}${h?`<small>${big(h)}</small>`:''}</button>`}return`<div class="card"><label class="lbl">Tocca un giorno per aggiungere o modificare le ore</label><div class="cal">${c}</div></div>`}

const dfmtL=d=>{const[y,m,x]=d.split('-');return new Date(y,m-1,x).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})};
const closeSh=()=>{sheet=null;stw=false;editId=null;dN='';msg='';conf=null;render()};
function sheetHtml(){const list=entries.filter(e=>e.d===sheet);return`<div class="ov"><div class="sh"><div class="shh"><h3>${dfmtL(sheet)}</h3><button class="x" data-cl="1" aria-label="Chiudi">✕</button></div>${list.length?list.map(e=>`<div class="li"><span class="d">${e.n?esc(e.n):'Ore inserite'}</span><span class="ac"><span class="h">${fmt(e.h)}</span>${conf===e.id?`<button class="del" data-x="${e.id}">Elimina</button><button data-k="1">Annulla</button>`:`<button data-e="${e.id}" aria-label="Modifica">✎</button><button data-x="${e.id}" aria-label="Elimina">✕</button>`}</span></div>`).join(''):'<div class="empty">Nessuna ora in questo giorno</div>'}<div class="frm"><label class="lbl">${editId?'Modifica inserimento':'Aggiungi ore'}</label><div class="row2"><div><label class="lbl">Ore</label><select id="hh">${[...Array(25)].map((_,i)=>`<option ${i===dHh?'selected':''}>${i}</option>`).join('')}</select></div><div><label class="lbl">Minuti</label><select id="mi">${[0,15,30,45].map(i=>`<option ${i===dMi?'selected':''}>${i}</option>`).join('')}</select></div></div><label class="lbl">Nota (facoltativa)</label><input id="nt" type="text" maxlength="80" placeholder="Un promemoria, se ti serve" value="${esc(dN)}" style="margin-bottom:12px"><button class="go" id="add">${editId?'Salva modifiche':'Aggiungi ore'}</button>${editId?'<button class="go cx" id="cx">Annulla</button>':''}<p class="msg">${msg}</p></div></div></div>`}
function statsHtml(){const m=months[sel],tot=entries.filter(e=>e.d>=months[0].key+'-01'&&e.d<=`${S+1}-08-31`).reduce((t,e)=>t+e.h,0),pass=Math.max(1,months.filter(x=>x.key<=todayIso.slice(0,7)).length);return`<div class="ov"><div class="sh"><div class="shh"><h3>📊 Statistiche</h3><button class="x" data-cl="1" aria-label="Chiudi">✕</button></div>${stats(m)||`<div class="card"><div class="empty">Ancora nessuna ora in ${m.name.toLowerCase()}</div></div>`}<div class="card"><label class="lbl">Anno di servizio</label><div class="stt"><div><b>${fmt(tot)}</b><small>ore totali</small></div><div><b>${fmt(tot/pass)}</b><small>media al mese</small></div><div><b>${months.filter(x=>sum(x.key)>=gm(x.key)).length}</b><small>mesi con obiettivo raggiunto</small></div><div><b>${fmt(Math.max(GY-tot,0))}</b><small>ore mancanti a ${GY}</small></div></div></div></div></div>`}
function render(){
const a=document.getElementById('app'),F=fx,NI=newId,TT=toast||imsg;fx='';newId=null;toast='';imsg='';let h=`<div class="top"><h1>Le mie ore</h1><span>Sett ${S} – Ago ${S+1}</span></div><div class="pg">`;
if(tab==='mese'){const m=months[sel],v=sum(m.key),G=gm(m.key);
h+=`<div class="nav"><button data-n="-1" ${sel===0?'disabled':''}>‹</button><h2>${ME[m.c]} ${m.name} ${m.y}</h2><button data-n="1" ${sel===11?'disabled':''}>›</button></div>${tags[m.c]?`<div style="text-align:center"><span class="chip">${esc(tags[m.c])}</span></div>`:''}${hero(v,G,'per arrivare a '+G)}${pace(m.key,v)}${cal(m,NI)}${todayIso.startsWith(m.key)?`<button class="go" data-dy="${todayIso}" style="margin-bottom:12px">＋ Aggiungi ore di oggi</button>`:''}<div class="sec"><button data-st="1"><span>📊 Statistiche</span><span class="chev">›</span></button></div>`}
else if(tab==='anno'){const tot=entries.filter(e=>e.d>=months[0].key+'-01'&&e.d<=`${S+1}-08-31`).reduce((t,e)=>t+e.h,0),cur=todayIso.slice(0,7),left=months.filter(m=>m.key>=cur).length,r=GY-tot;
h+=`<div class="nav"><h2>Riepilogo annuale</h2></div>${hero(tot,GY,'a fine anno')}<div class="card"><p class="note" style="margin:0 0 6px">Mesi con obiettivo raggiunto: ${months.filter(m=>sum(m.key)>=gm(m.key)).length} su 12</p>${months.map((m,i)=>{const v=sum(m.key),g=gm(m.key);return`<button class="mr ${m.key===cur?'cur':''}" data-m="${i}"><span class="n">${ME[m.c]} ${m.name.slice(0,3)}</span><span class="tr"><i class="${v>=g?'full':''}" style="width:${Math.min(v/g,1)*100}%"></i></span><span class="v">${fmt(v)}${v>=g?' ✓':''}</span>${tags[m.c]?`<small class="tg">${esc(tags[m.c])}</small>`:''}</button>`}).join('')}${r>0&&left>0?`<p class="note">Per arrivare a ${GY} servono circa ${fmt(r/left)} al mese nei ${left} mesi rimasti.</p>`:''}</div>`}
else{FO.forEach(loadFont);const SEC=(id,t,b)=>`<div class="sec${openSec===id?' op':''}"><button data-o="${id}"><span>${t}</span><span class="chev">›</span></button>${openSec===id?`<div class="bd">${b}</div>`:''}</div>`;
h+=`<div class="nav"><h2>⚙️ Impostazioni</h2></div>`+
SEC('tema','🎨 Tema e sfondo',`<label class="lbl">Tema</label><div class="sw">${[['auto','Auto'],...Object.entries(TH).map(([k,t])=>[k,t[0]])].map(([k,n])=>`<button class="swb ${pref.th===k?'on':''}" data-th="${k}"><i style="background:linear-gradient(135deg,${k==='auto'?'#f5f2ea 50%,#141a17 50%':TH[k][1]+' 50%,'+TH[k][7]+' 50%'})"></i>${n}</button>`).join('')}</div><label class="lbl">Sfondo</label><div class="sw sw2" style="margin-bottom:0">${[['solid','Tinta unita'],['grad','Sfumatura']].map(([k,n])=>`<button class="swb ${pref.bg===k?'on':''}" data-bg="${k}">${n}</button>`).join('')}</div>`)+
SEC('font','🔤 Carattere',`<label class="lbl">Vale anche per i numeri</label><div class="sw sw2" style="margin-bottom:0">${FO.map(f=>`<button class="swb ${pref.f===f[0]?'on':''}" data-f="${f[0]}" style="font-family:${f[2]};font-size:17px">Aa 0123<br><small>${f[1]}</small></button>`).join('')}</div>`)+
SEC('promo','🔔 Promemoria del mese',`<select id="tm" style="margin-bottom:10px">${MN.map((n,i)=>`<option value="${i}" ${i===tmSel?'selected':''}>${ME[i]} ${n}</option>`).join('')}</select><input id="tt" type="text" maxlength="40" placeholder="es. 🕊️ Campagna" value="${esc(tags[tmSel]||'')}" style="margin-bottom:12px"><button class="go" id="st">Salva promemoria</button><p class="note">Lascia vuoto il campo per toglierlo. Compare ogni anno in quel mese.</p>`)+
SEC('obi','🎯 Obiettivi',`<label class="lbl">Obiettivo di un mese specifico</label><select id="gs" style="margin-bottom:10px">${months.map((m,i)=>`<option value="${i}" ${i===gSel?'selected':''}>${ME[m.c]} ${m.name} ${m.y}</option>`).join('')}</select><input id="gv" type="number" inputmode="numeric" min="1" max="744" placeholder="${GM} (predefinito)" value="${goalsM[months[gSel].key]||''}" style="margin-bottom:12px"><button class="go" id="sgm">Salva obiettivo del mese</button><p class="note">Lascia vuoto per usare quello predefinito.</p><label class="lbl" style="margin-top:14px">Obiettivo predefinito al mese (ore)</label><input id="gm" type="number" inputmode="numeric" min="1" max="744" value="${GM}" style="margin-bottom:10px"><label class="lbl">Obiettivo all'anno (ore)</label><input id="gy" type="number" inputmode="numeric" min="1" max="8760" value="${GY}" style="margin-bottom:12px"><button class="go" id="sg">Salva obiettivi</button>`)+
SEC('bk','💾 Backup',`<p class="note" style="margin:0 0 12px">Scarica tutte le ore inserite in un file CSV, da aprire con Excel o Fogli.</p><button class="go" id="ex">Scarica le mie ore</button>`)+
`<p class="note" style="text-align:center">Versione v7 · 30 set 2026</p>`}
h+='</div>'+(TT?`<div class="toast">${esc(TT)}</div>`:'');
h+=`<div class="tabs"><button class="${tab==='mese'?'on':''}" data-t="mese">Mese</button><button class="${tab==='anno'?'on':''}" data-t="anno">Anno</button><button class="ic ${tab==='imp'?'on':''} ${F==='t'&&tab==='imp'?'spin':''}" data-t="imp" aria-label="Impostazioni"><span>⚙️</span></button></div>`;
h+=sheet?sheetHtml():stw?statsHtml():'';
a.innerHTML=h;a.className=F==='so'||F==='o'?F:F?'f '+F:'';document.documentElement.style.overflow=sheet||stw?'hidden':'';const g=s=>a.querySelectorAll(s);
g('[data-t]').forEach(b=>b.onclick=()=>{fx=tab!==b.dataset.t?'t':'';tab=b.dataset.t;conf=null;msg='';imsg='';editId=null;dN='';render()});
g('[data-n]').forEach(b=>b.onclick=()=>{fx=+b.dataset.n>0?'r':'l';sel+=+b.dataset.n;conf=null;editId=null;dN='';render()});
g('[data-m]').forEach(b=>b.onclick=()=>{fx='t';sel=+b.dataset.m;tab='mese';render()});
g('[data-x]').forEach(b=>b.onclick=()=>{const id=b.dataset.x;if(conf===id){entries=entries.filter(e=>e.id!==id);conf=null;save();toast='🗑️ Inserimento eliminato';if(editId===id){editId=null;dN=''}}else conf=id;render()});
g('[data-k]').forEach(b=>b.onclick=()=>{conf=null;render()});
g('[data-e]').forEach(b=>b.onclick=()=>{const e=entries.find(x=>x.id===b.dataset.e);if(!e)return;editId=e.id;const t=mm(e.h),r=t%60;dHh=Math.floor(t/60);dMi=[0,15,30,45].reduce((p,c)=>Math.abs(c-r)<Math.abs(p-r)?c:p,0);dN=e.n||'';conf=null;msg='';render()});
g('[data-th]').forEach(b=>b.onclick=()=>{pref.th=b.dataset.th;save();applyPref();render()});
g('[data-bg]').forEach(b=>b.onclick=()=>{pref.bg=b.dataset.bg;save();applyPref();render()});
g('[data-f]').forEach(b=>b.onclick=()=>{pref.f=b.dataset.f;save();applyPref();render()});
g('[data-dy]').forEach(b=>b.onclick=()=>{sheet=b.dataset.dy;editId=null;dN='';msg='';conf=null;fx='so';render()});
g('[data-st]').forEach(b=>b.onclick=()=>{stw=true;fx='so';render()});
g('[data-cl]').forEach(b=>b.onclick=closeSh);
g('[data-o]').forEach(b=>b.onclick=()=>{openSec=openSec===b.dataset.o?'':b.dataset.o;fx='o';render()});
const ov=a.querySelector('.ov');if(ov)ov.onclick=e=>{if(e.target===ov)closeSh()};
const gs=a.querySelector('#gs');if(gs){gs.onchange=()=>{gSel=+gs.value;imsg='';render()};a.querySelector('#sgm').onclick=()=>{const t=a.querySelector('#gv').value.trim(),v=+t,k=months[gSel].key;if(t===''||v===0)delete goalsM[k];else if(v>=1&&v<=744)goalsM[k]=Math.round(v);else{imsg='⚠️ Inserisci un obiettivo valido';return render()}save();imsg=goalsM[k]?'🎯 Obiettivo di '+months[gSel].name+' impostato a '+goalsM[k]+' h':'🎯 Obiettivo di '+months[gSel].name+' ripristinato a '+GM+' h';render()}}
const tm=a.querySelector('#tm');if(tm){tm.onchange=()=>{tmSel=+tm.value;imsg='';render()};a.querySelector('#st').onclick=()=>{const v=a.querySelector('#tt').value.trim();if(v)tags[tmSel]=v;else delete tags[tmSel];save();imsg='🔔 Promemoria di '+MN[tmSel]+(v?' salvato':' rimosso');render()}}
const sg=a.querySelector('#sg');if(sg){sg.onclick=()=>{const m=+a.querySelector('#gm').value,y=+a.querySelector('#gy').value;if(!(m>=1&&m<=744&&y>=1&&y<=8760)){imsg='⚠️ Inserisci obiettivi validi';return render()}GM=Math.round(m);GY=Math.round(y);save();imsg='🎯 Obiettivi salvati: '+GM+' h al mese, '+GY+' h all\'anno';render()};a.querySelector('#ex').onclick=exportCsv}
const hs=a.querySelector('#hh'),ms=a.querySelector('#mi'),nt=a.querySelector('#nt'),cx=a.querySelector('#cx');
if(cx)cx.onclick=()=>{editId=null;dN='';msg='';render()};
if(hs){hs.onchange=()=>dHh=+hs.value;ms.onchange=()=>dMi=+ms.value;nt.oninput=()=>dN=nt.value;a.querySelector('#add').onclick=()=>{const n=+hs.value+ +ms.value/60,k=sheet.slice(0,7),note=nt.value.trim(),before=sum(k);
if(!(n>0&&n<=24)){msg='Scegli ore e minuti (massimo 24 ore)';return render()}
const e=editId&&entries.find(x=>x.id===editId);
if(e){e.d=sheet;e.h=n;e.n=note}else entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:sheet,h:n,n:note});
newId=sheet;toast=e?'✓ Modifica salvata':(before<gm(k)&&sum(k)>=gm(k)?'🎉 Obiettivo del mese raggiunto!':'✓ Aggiunte '+fmt(n));fx='a';sheet=null;editId=null;dN='';msg='';save();render()}}}
applyPref();render();initDb();
{let x0=0,y0=0;const A=document.getElementById('app');A.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});A.addEventListener('touchend',e=>{if(tab!=='mese'||sheet||stw)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0,n=dx<0?1:-1;if(Math.abs(dx)>80&&Math.abs(dy)<40&&sel+n>=0&&sel+n<12&&!/INPUT|SELECT/.test(e.target.tagName)){sel+=n;conf=null;editId=null;dN='';fx=n>0?'r':'l';render()}},{passive:true})}
</script></body></html>
